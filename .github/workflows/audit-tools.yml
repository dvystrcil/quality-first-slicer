name: Audit tooling

on:
  pull_request:
    paths:
      - "tools/verify-source-archives.py"
      - "tests/test_verify_source_archives.py"
      - "audit/orcaslicer-v2.4.2-source-archives.json"
      - "audit/orcaslicer-v2.5.0-source-archives.json"
      - "tools/check-archive-manifest-coverage.py"
      - "tests/test_check_archive_manifest_coverage.py"
      - "tools/dependency-use-map/**"
      - "tests/test_dependency_use_map.py"
      - "audit/dependency-use-map-linux-x86_64.json"
      - "audit/dependency-use-map-linux-x86_64-v2.4.2.json"
      - ".github/workflows/audit-tools.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/verify-source-archives.py"
      - "tests/test_verify_source_archives.py"
      - "audit/orcaslicer-v2.4.2-source-archives.json"
      - "audit/orcaslicer-v2.5.0-source-archives.json"
      - "tools/check-archive-manifest-coverage.py"
      - "tests/test_check_archive_manifest_coverage.py"
      - "tools/dependency-use-map/**"
      - "tests/test_dependency_use_map.py"
      - "audit/dependency-use-map-linux-x86_64.json"
      - "audit/dependency-use-map-linux-x86_64-v2.4.2.json"
      - ".github/workflows/audit-tools.yml"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Source archive manifest to verify"
        type: choice
        default: audit/orcaslicer-v2.5.0-source-archives.json
        options:
          - audit/orcaslicer-v2.5.0-source-archives.json
          - audit/orcaslicer-v2.4.2-source-archives.json

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate audit JSON
        run: |
          python3 -m json.tool audit/orcaslicer-v2.4.2-source-archives.json >/dev/null
          python3 -m json.tool audit/orcaslicer-v2.5.0-source-archives.json >/dev/null
          python3 -m json.tool audit/dependency-use-map-linux-x86_64.json >/dev/null
          python3 -m json.tool audit/dependency-use-map-linux-x86_64-v2.4.2.json >/dev/null
      - name: Check dependency-use-map shell syntax
        run: bash -n tools/dependency-use-map/run.sh
      - name: Run audit-tool unit tests
        run: python3 -m unittest discover -s tests -v

  verify-archives:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANIFEST: ${{ inputs.manifest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name artifacts after the manifest
        run: |
          label="$(basename "$MANIFEST" -source-archives.json)"
          case "$label" in orcaslicer-v*) ;; *) echo "unexpected manifest: $MANIFEST" >&2; exit 1 ;; esac
          echo "LABEL=$label" >> "$GITHUB_ENV"
      - name: Download and independently verify source archives
        run: |
          python3 tools/verify-source-archives.py \
            --manifest "$MANIFEST" \
            --cache-dir "$RUNNER_TEMP/$LABEL-source-archives" \
            --preserve-mismatches-dir "$RUNNER_TEMP/$LABEL-mismatches" \
            --report "$RUNNER_TEMP/archive-verification-report.json"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.LABEL }}-archive-verification-report
          path: ${{ runner.temp }}/archive-verification-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload hash-mismatched archives for diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.LABEL }}-mismatched-archives
          path: ${{ runner.temp }}/${{ env.LABEL }}-mismatches/
          if-no-files-found: ignore
          retention-days: 30
