name: Audit tooling

on:
  pull_request:
    paths:
      - "tools/verify-source-archives.py"
      - "tests/test_verify_source_archives.py"
      - "audit/orcaslicer-v2.4.2-source-archives.json"
      - ".github/workflows/audit-tools.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/verify-source-archives.py"
      - "tests/test_verify_source_archives.py"
      - "audit/orcaslicer-v2.4.2-source-archives.json"
      - ".github/workflows/audit-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate manifest JSON
        run: python3 -m json.tool audit/orcaslicer-v2.4.2-source-archives.json >/dev/null
      - name: Run audit-tool unit tests
        run: python3 -m unittest discover -s tests -v

  verify-archives:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download and independently verify source archives
        run: |
          python3 tools/verify-source-archives.py \
            --cache-dir "$RUNNER_TEMP/orcaslicer-v2.4.2-source-archives" \
            --preserve-mismatches-dir "$RUNNER_TEMP/orcaslicer-v2.4.2-mismatches" \
            --report "$RUNNER_TEMP/archive-verification-report.json"
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orcaslicer-v2.4.2-archive-verification-report
          path: ${{ runner.temp }}/archive-verification-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload hash-mismatched archives for diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orcaslicer-v2.4.2-mismatched-archives
          path: ${{ runner.temp }}/orcaslicer-v2.4.2-mismatches/
          if-no-files-found: ignore
          retention-days: 30
