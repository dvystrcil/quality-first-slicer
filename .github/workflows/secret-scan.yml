name: secret-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits via the API
    steps:
      # Checkout (PR head SHA, full history) + gitleaks live in the shared
      # action, so a fix ships here by moving v1 (dvystrcil/homelab#2079).
      - uses: dvystrcil/secret-scan-action@v1
